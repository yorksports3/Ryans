name: Upload to TestFlight

# Builds, signs and uploads the iPhone app to App Store Connect (TestFlight)
# on a GitHub-hosted Mac. Run it by hand: Actions → Upload to TestFlight →
# Run workflow. Signing is fully automatic using an App Store Connect API key.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID            API key ID (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID         Issuer ID shown above the list of API keys
#   ASC_KEY_P8            Full contents of the downloaded AuthKey_XXXX.p8 file
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown on the App Store (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      VERSION: ${{ inputs.version }}
      # Every upload needs a new, higher build number. The run number always grows.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check that the Apple secrets are set
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v. See APP_STORE.md."; missing=1; fi
          done
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then echo "::error::Version must look like 1.0 or 1.0.1"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and sync web assets
        run: |
          npm ci
          npm run sync

      - name: Write the API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # Tidy common paste problems: Windows line endings, surrounding quotes,
          # a base64-encoded copy of the file, or missing/reflowed BEGIN/END lines.
          raw="${ASC_KEY_P8//$'\r'/}"
          raw="$(printf '%s' "$raw" | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*\$//")"
          had_header=yes
          if ! grep -q "BEGIN PRIVATE KEY" <<<"$raw"; then
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if grep -q "BEGIN PRIVATE KEY" <<<"$decoded"; then raw="$decoded"; else had_header=no; fi
          fi
          body="$(printf '%s' "$raw" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \t\n\r"'"'")"
          umask 077
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY_PATH"
          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::The ASC_KEY_P8 secret isn't a readable private key (header found: $had_header, key text length: ${#body}; an Apple .p8 key is usually about 184 characters long without its BEGIN/END lines). Open the AuthKey_XXXX.p8 file in a plain text editor and paste ALL of it, including the BEGIN and END lines, into the secret."
            exit 1
          fi
          echo "API key looks valid."

      - name: Archive (unsigned)
        # Automatic signing only signs archives for development, which needs a
        # registered iPhone. So archive unsigned here and let the export step
        # below sign it for the App Store with a cloud-managed distribution
        # certificate, which needs no device.
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > archive.log 2>&1 && status=0 || status=$?
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" archive.log || true
          test "$status" -eq 0

      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > upload.log 2>&1 && status=0 || status=$?
          grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload succeeded|Uploaded" upload.log || true
          test "$status" -eq 0
          echo "### Uploaded version $VERSION (build $BUILD_NUMBER) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 15–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$KEY_PATH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            archive.log
            upload.log
          if-no-files-found: ignore
