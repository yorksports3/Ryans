name: iOS build

# Compiles the iPhone app and its widget on a GitHub-hosted Mac, then runs it in
# the iOS Simulator and saves a screenshot. No Apple account or signing needed.
on:
  workflow_dispatch:
  push:
    paths:
      - "www/**"
      - "!www/jokes.js"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and sync web assets
        run: |
          npm ci
          npm run sync

      - name: Build for the iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || true
          test "$status" -eq 0
          test -d build/Build/Products/Debug-iphonesimulator/App.app/PlugIns/DadJokesWidget.appex

      - name: Launch in the Simulator and take a screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.yorksports3.dadjokes
          sleep 12
          xcrun simctl io "$DEVICE" screenshot simulator.png
          # Fail if the app crashed or quit
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.yorksports3.dadjokes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            simulator.png
            build.log
          if-no-files-found: ignore
