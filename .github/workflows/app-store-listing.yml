name: Update App Store listing

# Uploads the listing text (fastlane/metadata) and screenshots
# (appstore/screenshots) to the version being prepared in App Store Connect.
# Does NOT upload a build or submit for review. Run it by hand:
# Actions → Update App Store listing → Run workflow.
# Uses the same API key secrets as "Upload to TestFlight".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version to update (must already exist in App Store Connect)"
        required: true
        default: "1.0"
      screenshots:
        description: "Replace the screenshots too"
        type: boolean
        default: true

concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      VERSION: ${{ inputs.version }}
      SCREENSHOTS: ${{ inputs.screenshots }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write the API key
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          scripts/ci/write_asc_key.sh "$KEY"
          python3 - "$KEY" > "$RUNNER_TEMP/asc_api_key.json" <<'PY'
          import json, os, sys
          print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                            "key": open(sys.argv[1]).read(), "in_house": False}))
          PY
          rm -f "$KEY"

      - name: Gather screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots/en-US"
          cp appstore/screenshots/*.png "$RUNNER_TEMP/screenshots/en-US/"
          ls "$RUNNER_TEMP/screenshots/en-US"

      - name: Make sure the App Review section exists
        run: ruby scripts/ci/ensure_review_detail.rb "$RUNNER_TEMP/asc_api_key.json" com.yorksports3.dadjokes "$VERSION"

      - name: Upload listing to App Store Connect
        run: |
          if [ "$SCREENSHOTS" = "true" ]; then shots="--skip_screenshots false --overwrite_screenshots true"; else shots="--skip_screenshots true"; fi
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier com.yorksports3.dadjokes \
            --app_version "$VERSION" \
            --platform ios \
            --metadata_path fastlane/metadata \
            --screenshots_path "$RUNNER_TEMP/screenshots" \
            $shots \
            --skip_binary_upload true \
            --skip_app_version_update false \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_api_key.json"
